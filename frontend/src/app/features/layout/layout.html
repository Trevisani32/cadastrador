<div class="shell">

      <div class="flex itens-centro gap-sm">
        <div class="logo-mini" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="20" height="20" fill="none">
            <circle cx="32" cy="24" r="11" fill="#fff" />
            <path d="M12 52c0-11 9-18 20-18s20 7 20 18v3H12z" fill="#fff" />
          </svg>
        </div>
        <strong>Cadastro de Clientes</strong>
      </div>
      <div class="flex itens-centro gap-sm">

      </div>
    </div>

  <main class="conteudo">
    <router-outlet />

</div>
